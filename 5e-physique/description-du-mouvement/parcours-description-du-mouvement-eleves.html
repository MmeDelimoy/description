<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Parcours · Description du mouvement</title>
<style>
:root{--papier:#FAF6EC;--papier2:#F3ECDA;--encre:#1B2A41;--or:#B8932F;--or2:#8A6D1E;--bord:#E2D8BC;--gris:#6B6A62;
--za:#1F5F5B;--zb:#1F3A5F;--ok:#2E7D4F;--ko:#A63A3A;--bordo:#7A2E3A;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
--sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papier);color:var(--encre);font:17px/1.55 var(--sans);min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 56px}
header.top{text-align:center;padding:26px 8px 8px;border-bottom:1px solid var(--bord);background:linear-gradient(#FBF8EF,#F6EFDD);margin:0 -16px 8px}
header.top .k{font:600 .72rem/1.4 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--or2)}
header.top h1{font:400 1.8rem/1.15 var(--serif);margin:6px 0 4px}
header.top p{margin:0 auto 14px;color:#3A4660;font:italic 1.02rem/1.45 var(--serif);max-width:460px}
.bar{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-size:.9rem;color:var(--gris)}
.bar .tr{flex:1;height:10px;background:#E7DFC8;border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--or),#D9B64C);border-radius:6px;transition:width .4s}
.zone{margin:26px 0 4px;text-align:center}
.zone .z{display:inline-block;font:600 .74rem/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:#fff;padding:6px 14px;border-radius:20px}
.zone h2{font:400 1.35rem/1.2 var(--serif);margin:10px 0 2px}
.zone p{margin:0 auto;font-size:.92rem;color:var(--gris);max-width:420px}
.path{position:relative;width:min(340px,100%);margin:0 auto}
.path svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;width:132px;transform:translate(-50%,-34px);text-align:center;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.node .c{--p:0;width:68px;height:68px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;
background:conic-gradient(var(--zc) calc(var(--p)*1%),#DDD3B3 0);box-shadow:0 4px 0 rgba(27,42,65,.18);position:relative;transition:transform .15s}
.node .c:before{content:"";position:absolute;inset:6px;border-radius:50%;background:#FFFDF8}
.node .c span{position:relative;font:700 1.05rem/1 var(--serif);color:var(--zc)}
.node:active .c{transform:translateY(3px)}
.node.done .c{background:radial-gradient(circle at 30% 25%,#E8C964,var(--or));box-shadow:0 4px 0 #8A6D1E}
.node.done .c:before{display:none}
.node.done .c span{color:#fff;font-size:1.6rem}
.node small{display:block;margin-top:7px;font:600 .8rem/1.25 var(--sans);color:var(--encre)}
.cta{display:block;width:100%;border:0;border-radius:14px;padding:14px 18px;font:700 1.02rem var(--sans);cursor:pointer;color:#fff;background:var(--zb);box-shadow:0 4px 0 rgba(0,0,0,.22);margin:16px 0 0}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.cta.sec{background:#fff;color:var(--encre);border:1.5px solid var(--bord);box-shadow:0 3px 0 var(--bord)}
.cta[disabled]{opacity:.45}
.reset{display:block;margin:34px auto 0;background:none;border:0;color:var(--gris);font:.85rem var(--sans);text-decoration:underline;cursor:pointer}
.back{background:none;border:0;font:600 .95rem var(--sans);color:var(--zb);padding:14px 0 6px;cursor:pointer}
.card{background:#FFFDF8;border:1px solid var(--bord);border-radius:16px;padding:18px 18px 20px;box-shadow:0 8px 22px rgba(27,42,65,.08)}
.card .kk{font:600 .72rem/1.3 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--or2)}
.card h2{font:400 1.55rem/1.2 var(--serif);margin:4px 0 10px}
.card p{margin:.55em 0;line-height:1.8}
.fig{text-align:center;margin:12px 0}
.fig svg{max-width:100%;height:auto}
.retiens{background:var(--papier2);border-left:4px solid var(--or);border-radius:0 10px 10px 0;padding:10px 14px;margin:14px 0}
.retiens b.t{display:block;font:600 .72rem/1.3 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--or2);margin-bottom:2px}
.lab{border:1px dashed var(--bord);border-radius:12px;padding:10px 12px;margin:14px 0;background:#fff}
.lab .t{font:600 .72rem/1.3 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--za)}
.lab label{display:flex;align-items:center;gap:10px;font-size:.92rem;margin:6px 0}
.lab label span.n{min-width:96px}
.lab input[type=range]{flex:1;accent-color:var(--zb)}
.lab .ro{font-size:.95rem;background:var(--papier);border-radius:8px;padding:6px 10px;margin-top:6px}
.vec{position:relative;display:inline-block;font-style:italic;white-space:nowrap}
.vec:before{content:"→";position:absolute;left:50%;top:-.56em;transform:translateX(-50%) scale(.75);font-style:normal;line-height:1}
.q{margin-top:6px}
.q .qq{font-size:1.06rem;margin:6px 0 4px;line-height:1.95}
.opt{line-height:1.8;display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--bord);border-radius:12px;padding:12px 14px;margin:9px 0;font:1rem/1.4 var(--sans);color:var(--encre);cursor:pointer;box-shadow:0 3px 0 var(--bord)}
.opt.sel{border-color:var(--zb);background:#EEF2F9;box-shadow:0 3px 0 var(--zb)}
.opt.good{border-color:var(--ok);background:#E8F4EC;box-shadow:0 3px 0 var(--ok)}
.opt.bad{border-color:var(--ko);background:#FBEAEA;box-shadow:0 3px 0 var(--ko)}
.numrow{display:flex;gap:10px;align-items:center;margin:12px 0}
.numrow input{flex:1;font:1.25rem var(--sans);padding:11px 12px;border:1.5px solid var(--bord);border-radius:12px;background:#fff;color:var(--encre);min-width:0}
.numrow .u{font-size:1.05rem;color:var(--gris);min-width:32px}
.fb{line-height:1.8;border-radius:12px;padding:12px 14px;margin-top:14px;font-size:.98rem}
.fb.ok{background:#E8F4EC;border:1px solid #B7DAC3}
.fb.ko{background:#FBEAEA;border:1px solid #EBC0C0}
.fb b.h{display:block;font-size:1.05rem;margin-bottom:3px}
.sess-top{display:flex;align-items:center;gap:12px;padding:14px 0 6px}
.sess-top .x{background:none;border:0;font-size:1.5rem;color:var(--gris);cursor:pointer;padding:0 4px}
.sess-top .tr{flex:1;height:12px;background:#E7DFC8;border-radius:7px;overflow:hidden}
.sess-top .tr i{display:block;height:100%;background:var(--ok);border-radius:7px;transition:width .35s}
.nodeSel{cursor:pointer}
.res h2{font:400 1.6rem/1.2 var(--serif);margin:4px 0}
.res .big{font:400 2.6rem/1 var(--serif);color:var(--or2);margin:6px 0}
.sm{font-size:.88rem;color:var(--gris)}
#sky{position:fixed;inset:0;background:rgba(10,16,32,.86);display:none;z-index:50}
#sky canvas{position:absolute;inset:0;width:100%;height:100%}
#sky .msg{position:absolute;left:0;right:0;bottom:11%;text-align:center;color:#fff;padding:0 24px}
#sky .msg h2{font:400 2.2rem/1.1 var(--serif);margin:0 0 6px}
#sky .msg p{margin:0 0 14px;color:#E5E7EE}
#sky .cta{display:inline-block;width:auto;padding:12px 26px;background:var(--or)}
</style></head>
<body>
<div class="wrap">
<header class="top"><div class="k">5e · Physique · UAA5 · Chapitre I</div><h1>Description du mouvement</h1><p>Un parcours en deux zones : d’abord les outils de maths, ensuite le chapitre.</p></header>
<div id="app"></div>
</div>
<div id="sky"><canvas id="fw"></canvas><div class="msg"><h2 id="bravo">Bravo !</h2><p id="bravop"></p><button class="cta" id="skyok">Continuer</button></div></div>
<script>
/* ================= Outils ================= */
const $=id=>document.getElementById(id);
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const rnd=(x,d)=>{const p=Math.pow(10,d==null?1:d);return Math.round(x*p+(x>=0?1e-9:-1e-9))/p;};
const fr=(x,d)=>{d=d==null?1:d;let v=rnd(x,d);if(v===0)return '0';let s=v.toFixed(d);if(s.indexOf('.')>=0)s=s.replace(/0+$/,'').replace(/\.$/,'');return s.replace('.',',').replace('-','−');};
const pa=x=>x<0?`(${fr(x)})`:fr(x);
const sg=n=>n<0?'−':'+';
const D2R=Math.PI/180;
const sinD=a=>Math.sin(a*D2R),cosD=a=>Math.cos(a*D2R),atanD=x=>Math.atan(x)/D2R;
const V=(n)=>`<span class="vec">${n}</span>`;
const pr=(a,b)=>`(${fr(a)} ; ${fr(b)})`;
const TR=[[3,4,5],[5,12,13],[8,15,17],[6,8,10],[9,12,15],[7,24,25]];
const SM=[[3,4,5],[6,8,10],[5,12,13],[9,12,15]];
const sq=x=>x*x;

/* questions : constructeurs */
const MC=(q,good,bads,expl,svg,fixed)=>{let o=[{x:good,ok:1}].concat(bads.map(b=>({x:b,ok:0})));return {t:'mcq',q,svg:svg||'',opts:fixed?o:shuffle(o),expl};};
const NU=(q,ans,tol,unit,expl,svg,dec)=>({t:'num',q,ans,tol,unit:unit||'',expl,svg:svg||'',dec:dec==null?1:dec});
const TFQ=(q,trues,falses)=>{const isT=Math.random()<.5;const s=isT?pick(trues):pick(falses);
  return {t:'mcq',q:q+`<br><i>${s[0]}</i>`,svg:'',opts:[{x:'Vrai',ok:isT?1:0},{x:'Faux',ok:isT?0:1}],expl:s[1]};};

/* ================= Plan cartésien SVG ================= */
function plane(x0,x1,y0,y1,c){
  c=c||26;const W=(x1-x0)*c,H=(y1-y0)*c;
  const X=x=>(x-x0)*c,Y=y=>(y1-y)*c;let s='';const o={W,H,X,Y,c};
  o.grid=function(){
    for(let i=Math.ceil(x0);i<=Math.floor(x1);i++)s+=`<line x1="${X(i)}" y1="0" x2="${X(i)}" y2="${H}" stroke="#E4DAB9" stroke-width="1"/>`;
    for(let j=Math.ceil(y0);j<=Math.floor(y1);j++)s+=`<line x1="0" y1="${Y(j)}" x2="${W}" y2="${Y(j)}" stroke="#E4DAB9" stroke-width="1"/>`;
    s+=`<rect x="0" y="0" width="${W}" height="${H}" fill="none" stroke="#CFC39C"/>`;return o;};
  o.axes=function(tickStep,noTicks){
    tickStep=tickStep||1;
    if(y0<=0&&y1>=0)s+=`<line x1="0" y1="${Y(0)}" x2="${W}" y2="${Y(0)}" stroke="#1B2A41" stroke-width="1.6"/>`;
    if(x0<=0&&x1>=0)s+=`<line x1="${X(0)}" y1="0" x2="${X(0)}" y2="${H}" stroke="#1B2A41" stroke-width="1.6"/>`;
    if(!noTicks){
      for(let i=Math.ceil(x0);i<=Math.floor(x1);i++)if(i%tickStep===0)s+=`<text x="${X(i)}" y="${H+14}" font-size="10.5" text-anchor="middle" fill="#6B6A62">${String(i).replace('-','−')}</text>`;
      for(let j=Math.ceil(y0);j<=Math.floor(y1);j++)if(j%tickStep===0)s+=`<text x="-5" y="${Y(j)+3.5}" font-size="10.5" text-anchor="end" fill="#6B6A62">${String(j).replace('-','−')}</text>`;
    }
    return o;};
  o.line=function(xa,ya,xb,yb,col,w,dash){s+=`<line x1="${X(xa)}" y1="${Y(ya)}" x2="${X(xb)}" y2="${Y(yb)}" stroke="${col||'#1B2A41'}" stroke-width="${w||1.6}" ${dash?'stroke-dasharray="5 4"':''}/>`;return o;};
  o.arrow=function(xa,ya,xb,yb,col,w,dash){col=col||'#7A2E3A';w=w||2.6;
    const ax=X(xa),ay=Y(ya),bx=X(xb),by=Y(yb),dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy);if(L<2)return o;
    const ux=dx/L,uy=dy/L,h=Math.min(11,L*.6),px=-uy,py=ux;
    s+=`<line x1="${ax}" y1="${ay}" x2="${bx-ux*h*.7}" y2="${by-uy*h*.7}" stroke="${col}" stroke-width="${w}" ${dash?'stroke-dasharray="5 4"':''}/>`;
    s+=`<polygon points="${bx},${by} ${bx-ux*h+px*h*.42},${by-uy*h+py*h*.42} ${bx-ux*h-px*h*.42},${by-uy*h-py*h*.42}" fill="${col}"/>`;return o;};
  o.dot=function(x,y,col,r){s+=`<circle cx="${X(x)}" cy="${Y(y)}" r="${r||4.5}" fill="${col||'#1F3A5F'}"/>`;return o;};
  o.txt=function(x,y,t,dx,dy,col,anchor,size){s+=`<text x="${X(x)+(dx||0)}" y="${Y(y)+(dy||0)}" font-size="${size||13}" font-style="italic" font-family="Georgia,serif" fill="${col||'#1B2A41'}" text-anchor="${anchor||'middle'}">${t}</text>`;return o;};
  o.raw=function(t){s+=t;return o;};
  o.svg=function(){return `<svg viewBox="-22 -8 ${W+34} ${H+30}" width="${W+34}" style="max-width:100%;height:auto" role="img" aria-hidden="true">${s}</svg>`;};
  return o;
}

/* triangle rectangle : cote horizontal h, vertical v, hypotenuse y ; alpha au sommet de droite */
function triSvg(h,v,y,alpha){
  const Bx=190,By=112,Ax=22,Cy=34;
  const th=Math.atan2(By-Cy,Bx-Ax);
  let s=`<polygon points="${Ax},${By} ${Bx},${By} ${Ax},${Cy}" fill="#F3ECDA" stroke="#1B2A41" stroke-width="2"/>`;
  s+=`<path d="M${Ax},${By-12} h12 v12" fill="none" stroke="#1B2A41" stroke-width="1.4"/>`;
  s+=`<text x="${(Ax+Bx)/2}" y="${By+17}" text-anchor="middle" font-size="14" font-style="italic" font-family="Georgia,serif" fill="#1B2A41">${h}</text>`;
  s+=`<text x="${Ax-7}" y="${(By+Cy)/2+4}" text-anchor="end" font-size="14" font-style="italic" font-family="Georgia,serif" fill="#1B2A41">${v}</text>`;
  s+=`<text x="${(Ax+Bx)/2+8}" y="${(By+Cy)/2-8}" text-anchor="start" font-size="14" font-style="italic" font-family="Georgia,serif" fill="#7A2E3A">${y}</text>`;
  if(alpha){const r=30;s+=`<path d="M${Bx-r},${By} A${r},${r} 0 0 1 ${Bx-r*Math.cos(th)},${By-r*Math.sin(th)}" fill="none" stroke="#B8932F" stroke-width="2"/>`;
    s+=`<text x="${Bx-44}" y="${By-6}" text-anchor="middle" font-size="15" font-family="Georgia,serif" fill="#8A6D1E">α</text>`;}
  return `<svg viewBox="-30 8 270 128" width="270" style="max-width:100%;height:auto" aria-hidden="true">${s}</svg>`;
}

/* grille de reperage pour les questions (cases de 1 m) */
function gridQ(x0,x1,y0,y1,c){const p=plane(x0,x1,y0,y1,c||26);p.grid().axes(1);return p;}

/* chronophotographie : images k = 1..N, position (xs[k-1], ys[k-1]) */
function chronoSvg(xs,ys,x1,y1,opts){
  opts=opts||{};const p=gridQ(0,x1,-1,y1,opts.c||24);
  for(let i=0;i<xs.length;i++){p.dot(xs[i],ys[i],'#1F3A5F',4.2);p.txt(xs[i],ys[i],String(i+1),0,-9,'#7A2E3A','middle',11.5);}
  if(opts.line){for(let i=0;i<xs.length-1;i++)p.line(xs[i],ys[i],xs[i+1],ys[i+1],'#C9BE96',1.2,true);}
  return p.svg();
}
/* ================= Questions (générateurs aléatoires) ================= */
const TP=(q,tx,ty,box,expl,over)=>{
  const [x0,x1,y0,y1]=box;const p=gridQ(x0,x1,y0,y1,26);if(over)over(p);
  for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)p.raw(`<circle class="nd" data-x="${x}" data-y="${y}" cx="${p.X(x)}" cy="${p.Y(y)}" r="12" fill="rgba(0,0,0,0.001)"/>`);
  return {t:'tap',q,tx,ty,svg:p.svg(),expl,box};
};
const hyp=(a,b)=>Math.sqrt(a*a+b*b);
const LET=[['a','b','c'],['x','y','z'],['p','q','r']];

const T={};

/* ---------- A1 Pythagore ---------- */
T.A1=[
()=>{const a=ri(3,12),b=ri(3,12),c=hyp(a,b);
  return NU(`Dans un triangle rectangle, les deux côtés de l’angle droit mesurent <b>${a} cm</b> et <b>${b} cm</b>. Calcule l’hypoténuse (arrondie au dixième).`,c,.06,'cm',
  `c² = a² + b² = ${a}² + ${b}² = ${a*a} + ${b*b} = ${a*a+b*b}, donc c = √${a*a+b*b} ≈ ${fr(c,1)} cm.`,triSvg(a+' cm',b+' cm','?'));},
()=>{const t=pick(TR),sw=Math.random()<.5,a=sw?t[1]:t[0],b=sw?t[0]:t[1],c=t[2];
  return NU(`L’hypoténuse d’un triangle rectangle mesure <b>${c} cm</b> et un côté de l’angle droit mesure <b>${a} cm</b>. Calcule l’autre côté de l’angle droit.`,b,.06,'cm',
  `b² = c² − a² = ${c}² − ${a}² = ${c*c} − ${a*a} = ${b*b}, donc b = √${b*b} = ${b} cm. (Attention : on <i>soustrait</i> quand on cherche un côté de l’angle droit.)`,triSvg(a+' cm','?',c+' cm'));},
()=>{const L=pick(LET),[a,b,c]=L;
  return MC(`Dans un triangle rectangle, le côté <b>${c}</b> est l’hypoténuse. Quelle égalité est correcte ?`,`${c}² = ${a}² + ${b}²`,[`${a}² = ${b}² + ${c}²`,`${c} = ${a} + ${b}`,`${c}² = ${a}² − ${b}²`],
  `Le carré de l’hypoténuse est égal à la somme des carrés des deux autres côtés : ${c}² = ${a}² + ${b}².`,triSvg(a,b,c));},
()=>{const t=pick(TR);const k=pick([1,1,2]);let s=t.map(x=>x*k);const right=Math.random()<.5;
  if(!right)s[ri(0,1)]+=pick([-1,1,2]);
  s=s.map(x=>Math.max(x,2));const so=s.slice().sort((p,q)=>p-q);const l=so[0]*so[0]+so[1]*so[1],h=so[2]*so[2];const isR=(l===h);
  return MC(`Un triangle a pour côtés <b>${shuffle(s).join(' cm, ')} cm</b>. Est-il rectangle ?`,isR?'Oui, il est rectangle':'Non, il n’est pas rectangle',[isR?'Non, il n’est pas rectangle':'Oui, il est rectangle'],
  `On compare le carré du plus grand côté et la somme des carrés des deux autres : ${so[2]}² = ${h} et ${so[0]}² + ${so[1]}² = ${so[0]*so[0]} + ${so[1]*so[1]} = ${l}. ${isR?'Les deux valeurs sont égales : le triangle est rectangle.':'Les valeurs sont différentes : le triangle n’est pas rectangle.'}`,'',true);},
()=>{const t=pick(SM),dx=Math.random()<.5?t[0]:t[1],dy=dx===t[0]?t[1]:t[0],x1=ri(-3,2),y1=ri(-2,1);
  const sx=Math.random()<.5?1:-1,sy=Math.random()<.5?1:-1;let x2=x1+sx*dx,y2=y1+sy*dy;
  if(x2>7||x2<-7||y2>7||y2<-7){x2=x1+(-sx)*dx;y2=y1+(-sy)*dy;}
  const bx=[Math.min(x1,x2)-1,Math.max(x1,x2)+1,Math.min(y1,y2)-1,Math.max(y1,y2)+1];
  const p=gridQ(bx[0],bx[1],bx[2],bx[3],24);p.line(x1,y1,x2,y1,'#8A6D1E',1.6,true).line(x2,y1,x2,y2,'#8A6D1E',1.6,true).line(x1,y1,x2,y2,'#7A2E3A',2.4).dot(x1,y1).dot(x2,y2).txt(x1,y1,'A',-10,-8).txt(x2,y2,'B',10,-8);
  const d=hyp(dx,dy);
  return NU(`Sur ce quadrillage, 1 carreau = 1 m. Quelle est la distance entre les points <b>A</b> et <b>B</b> ?`,d,.06,'m',`On passe par le triangle rectangle en pointillés : ${dx} m horizontalement et ${dy} m verticalement. AB = √(${dx}² + ${dy}²) = √${dx*dx+dy*dy} = ${fr(d,1)} m.`,p.svg());},
()=>{const t=pick(TR),e=Math.random()<.5,d1=e?t[0]:t[1],d2=e?t[1]:t[0],c=t[2];
  return NU(`Un randonneur marche <b>${d1} m vers l’est</b>, puis <b>${d2} m vers le nord</b>. À quelle distance est-il de son point de départ (en ligne droite) ?`,c,.06,'m',
  `Les deux trajets sont perpendiculaires : distance = √(${d1}² + ${d2}²) = √${d1*d1+d2*d2} = ${c} m. Ce n’est pas ${d1+d2} m, qui est la longueur du chemin parcouru.`);},
()=>MC(`Dans un triangle rectangle, l’hypoténuse est…`,`le côté opposé à l’angle droit, et c’est le plus long`,[`un des deux côtés de l’angle droit`,`le côté le plus court`,`toujours le côté horizontal`],

/* ---------- A2 Sinus, cosinus, tangente ---------- */
T.A2=[

  `Le côté <b>${v}</b> est en face de α (opposé), le côté <b>${h}</b> touche α et l’angle droit (adjacent), le côté <b>${y}</b> est l’hypoténuse.`,triSvg(h,v,y,true));},
()=>{const L=shuffle(['a','b','c']),h=L[0],v=L[1],y=L[2],f=pick(['sin','cos','tan']);

  const all=[[v,y],[h,y],[v,h],[y,h],[y,v],[h,v]].filter(p=>!(p[0]===num&&p[1]===den));
  const wr=shuffle(all).slice(0,3).map(p=>`${p[0]} / ${p[1]}`);
  return MC(`D’après ce triangle, que vaut <b>${f} α</b> ?`,`${num} / ${den}`,wr,
  `SOH-CAH-TOA : sin α = opposé / hypoténuse, cos α = adjacent / hypoténuse, tan α = opposé / adjacent. Ici l’opposé est ${v}, l’adjacent ${h} et l’hypoténuse ${y}, donc ${f} α = ${num} / ${den}.`,triSvg(h,v,y,true));},
()=>{const H=ri(5,20),a=ri(15,75),o=H*sinD(a);
  return NU(`Dans un triangle rectangle, l’hypoténuse mesure <b>${H} cm</b> et l’angle α vaut <b>${a}°</b>. Calcule le côté <b>opposé</b> à α (arrondi au dixième).`,o,.06,'cm',
  `sin α = opposé / hypoténuse, donc opposé = ${H} × sin ${a}° = ${H} × ${fr(sinD(a),3)} ≈ ${fr(o,1)} cm. (Calculatrice en mode degrés.)`,triSvg('','?',H+' cm',true));},
()=>{const H=ri(5,20),a=ri(15,75),o=H*cosD(a);
  return NU(`Dans un triangle rectangle, l’hypoténuse mesure <b>${H} cm</b> et l’angle α vaut <b>${a}°</b>. Calcule le côté <b>adjacent</b> à α (arrondi au dixième).`,o,.06,'cm',
  `cos α = adjacent / hypoténuse, donc adjacent = ${H} × cos ${a}° = ${H} × ${fr(cosD(a),3)} ≈ ${fr(o,1)} cm.`,triSvg('?','',H+' cm',true));},
()=>{const o=ri(2,9),a=ri(2,9),ang=atanD(o/a);
  return NU(`Dans un triangle rectangle, le côté opposé à α mesure <b>${o} cm</b> et le côté adjacent mesure <b>${a} cm</b>. Calcule α en degrés (arrondi au dixième).`,ang,.6,'°',
  `tan α = opposé / adjacent = ${o} / ${a} = ${fr(o/a,3)}. Donc α = arctan(${fr(o/a,3)}) ≈ ${fr(ang,1)}° (touche tan⁻¹ ou arctan).`,triSvg(a+' cm',o+' cm','',true));},
()=>{const H=ri(6,15),a=ri(2,H-1),ang=Math.acos(a/H)/D2R;

  `cos α = adjacent / hypoténuse = ${a} / ${H} = ${fr(a/H,3)}. Donc α = arccos(${fr(a/H,3)}) ≈ ${fr(ang,1)}° (touche cos⁻¹ ou arccos).`,triSvg(a+' cm','',H+' cm',true));},
()=>{const a=pick([20,25,30,35,40,45,50,60,70]),f=pick(['sin','cos']);const rad=f==='sin'?Math.sin(a):Math.cos(a),deg=f==='sin'?sinD(a):cosD(a);
  return MC(`Tu tapes <b>${f} ${a}</b> sur ta calculatrice et elle affiche <b>${fr(rad,3)}</b>, alors que tu attendais ${fr(deg,3)}. Que faire ?`,`La passer en mode degrés (DEG)`,[`La passer en mode radians (RAD)`,`Remplacer ${f} par tan`,`Rien : c’est normal`],
  `Pour un angle donné en degrés, la calculatrice doit être en mode DEG. En mode RAD, elle comprend « ${a} radians » : c’est une autre valeur (${fr(rad,3)}).`);},
()=>{const a=ri(15,75);

];

/* ---------- A3 Composantes ---------- */
const SIGNS={1:['+','+'],2:['−','+'],3:['−','−'],4:['+','−']};
T.A3=[
()=>{const v=ri(5,30),a=ri(10,80),x=v*cosD(a);

  `v<sub>x</sub> = v cos α = ${v} × cos ${a}° = ${v} × ${fr(cosD(a),3)} ≈ ${fr(x,1)} m/s.`);},
()=>{const v=ri(5,30),a=ri(10,80),y=v*sinD(a);

  `${a}° est dans le ${qd}ᵉ quadrant : cos ${a}° est ${s[0]==='+'?'positif':'négatif'} et sin ${a}° est ${s[1]==='+'?'positif':'négatif'}. Signes : ${fmt(s)}.`);},
()=>{const v=ri(5,30),a=ri(100,260),x=v*cosD(a);

  `v<sub>x</sub> = ${v} × cos ${a}° = ${v} × (${fr(cosD(a),3)}) ≈ ${fr(x,1)} m/s. Le signe vient directement de la calculatrice : ne le rajoute pas à la main.`);},
()=>{const v=ri(5,30),a=ri(190,350),y=v*sinD(a);
  return NU(`Un vecteur vitesse de norme <b>${v} m/s</b> fait un angle de <b>${a}°</b> avec l’axe Ox. Calcule <b>v<sub>y</sub></b> (au dixième, avec son signe).`,y,.06,'m/s',
  `v<sub>y</sub> = ${v} × sin ${a}° = ${v} × (${fr(sinD(a),3)}) ≈ ${fr(y,1)} m/s. Le mobile descend, donc v<sub>y</sub> est négatif.`);},
()=>{const n=ri(2,9),d=pick(['droite','gauche','haut','bas']);

  const all=[[n,0],[-n,0],[0,n],[0,-n]];
  return MC(`Un mobile se déplace vers <b>${({droite:'la droite',gauche:'la gauche',haut:'le haut',bas:'le bas'})[d]}</b> à <b>${n} m/s</b> (axe Ox vers la droite, axe Oy vers le haut). Quelles sont les composantes de sa vitesse ?`,pr(comp[0],comp[1]),all.filter(z=>!(z[0]===comp[0]&&z[1]===comp[1])).map(z=>pr(z[0],z[1])),
  `${d==='droite'||d==='gauche'?'Horizontalement':'Verticalement'} : ${d==='droite'||d==='gauche'?'seule v<sub>x</sub> est non nulle':'seule v<sub>y</sub> est non nulle'}, et son signe dépend du sens par rapport à l’axe : ${pr(comp[0],comp[1])}.`);},
()=>{const x=ri(-5,5),y=ri(-5,5);if(x===0&&y===0)return T.A3[6]();const which=Math.random()<.5?'x':'y',val=which==='x'?x:y;
  const p=gridQ(-6,6,-6,6,22);p.line(0,0,x,0,'#8A6D1E',1.6,true).line(x,0,x,y,'#8A6D1E',1.6,true).arrow(0,0,x,y,'#7A2E3A',2.8).dot(x,y,'#7A2E3A',3.5);
  return NU(`Le vecteur représenté (1 carreau = 1 m/s) part de l’origine. Lis sa composante <b>v<sub>${which}</sub></b> (avec son signe).`,val,.01,'m/s',
  `On projette l’extrémité de la flèche sur les axes : v<sub>x</sub> = ${fr(x)} m/s et v<sub>y</sub> = ${fr(y)} m/s. La composante est négative si la projection est à gauche de O (pour x) ou sous O (pour y).`,p.svg(),0);},
()=>{const v=ri(8,30),b=ri(20,70),x=v*sinD(b);
  return NU(`Un projectile part à <b>${v} m/s</b>. Son vecteur vitesse fait un angle de <b>${b}°</b> avec la <b>verticale</b>. Calcule sa composante <b>horizontale</b> v<sub>x</sub> (au dixième).`,x,.06,'m/s',
  `Attention : l’angle est mesuré par rapport à la verticale, donc le côté horizontal est le côté <i>opposé</i> à l’angle. v<sub>x</sub> = v sin ${b}° = ${v} × ${fr(sinD(b),3)} ≈ ${fr(x,1)} m/s (et non v cos).`);}

/* ---------- A4 Norme et angle ---------- */
T.A4=[
()=>{const t=pick(TR),e=Math.random()<.5,x=(e?t[0]:t[1])*pick([1,1,-1]),y=(e?t[1]:t[0])*pick([1,-1]);

()=>{const x=ri(1,8),y=ri(1,8),a=atanD(y/x);

  `tan α = v<sub>y</sub> / v<sub>x</sub> = ${y} / ${x} = ${fr(y/x,3)}, donc α = arctan(${fr(y/x,3)}) ≈ ${fr(a,1)}°. Les deux composantes sont positives : 1ᵉʳ quadrant, aucune correction.`);},
()=>{const x=ri(-8,8)||3,y=ri(-8,8)||-4;const q=x>0&&y>0?1:x<0&&y>0?2:x<0&&y<0?3:4;
  return MC(`Un vecteur a pour composantes <b>(${fr(x)} ; ${fr(y)})</b>. Dans quel quadrant (I : x>0 et y>0, puis dans le sens trigonométrique) se trouve-t-il ?`,['I','II','III','IV'][q-1],['I','II','III','IV'].filter((_,i)=>i!==q-1),
  `Signes (${sg(x)} ; ${sg(y)}) : c’est le quadrant ${['I','II','III','IV'][q-1]}. Dans l’ordre : I (+ +), II (− +), III (− −), IV (+ −).`,'',true);},
()=>{const x=-ri(1,8),y=ri(1,8),t=atanD(y/x),a=180+t;
  return NU(`Un vecteur a pour composantes <b>(${fr(x)} ; ${fr(y)})</b>. Calcule l’angle α qu’il fait avec l’axe Ox, compris entre 0° et 360° (au dixième).`,a,.6,'°',
  `La calculatrice donne arctan(${y}/${fr(x)}) = ${fr(t,1)}°. Mais v<sub>x</sub> &lt; 0 et v<sub>y</sub> &gt; 0 : le vecteur est dans le 2ᵉ quadrant. On ajoute 180° : α = 180° + (${fr(t,1)}°) = ${fr(a,1)}°.`);},
()=>{const x=-ri(1,8),y=-ri(1,8),t=atanD(y/x),a=180+t;

  `La calculatrice donne arctan(${fr(y)}/${fr(x)}) = arctan(${fr(y/x,3)}) = ${fr(t,1)}°. Mais les deux composantes sont négatives : 3ᵉ quadrant. On ajoute 180° : α = 180° + ${fr(t,1)}° = ${fr(a,1)}°.`);},
()=>{const x=ri(2,8),y=-ri(1,8),t=atanD(y/x);

  `v<sub>x</sub> &gt; 0 et v<sub>y</sub> &lt; 0 : 4ᵉ quadrant. La valeur de la calculatrice (${fr(t,1)}°) est déjà correcte : c’est un angle négatif (sous l’axe Ox), équivalent à ${fr(360+t,1)}°.`);},
()=>{const a=ri(2,9),b=ri(2,9),c=hyp(a,b);
  return NU(`Un vecteur a pour composantes <b>(−${a} ; −${b})</b>. Calcule sa norme (au dixième).`,c,.06,'',
  `Les carrés rendent les nombres positifs : ‖v‖ = √((−${a})² + (−${b})²) = √(${a*a} + ${b*b}) = √${a*a+b*b} ≈ ${fr(c,1)}. Une norme est toujours positive.`);}

T.A5=[

()=>MC(`Un mobile passe du point A (vecteur position ${V('r')}<sub>A</sub>) au point B (vecteur position ${V('r')}<sub>B</sub>). Quel calcul donne le vecteur qui va de A vers B ?`,`${V('r')}<sub>B</sub> − ${V('r')}<sub>A</sub>`,[`${V('r')}<sub>A</sub> − ${V('r')}<sub>B</sub>`,`${V('r')}<sub>A</sub> + ${V('r')}<sub>B</sub>`,`‖${V('r')}<sub>B</sub>‖ − ‖${V('r')}<sub>A</sub>‖`],

()=>{const x=ri(1,8),y=ri(1,8),ox=ri(1,x+2),oy=ri(1,y+2);
  return NU(`Dans un repère d’origine O, un point M a pour coordonnées <b>(${x} ; ${y})</b>. On choisit une nouvelle origine O′, située au point <b>(${ox} ; ${oy})</b> de l’ancien repère (axes parallèles). Quelle est la <b>nouvelle ordonnée</b> de M ?`,y-oy,.01,'m',`y′ = y − y<sub>O′</sub> = ${y} − ${oy} = ${fr(y-oy)} m.`,'',0);},
()=>MC(`Un ballon est lancé depuis le sol, il monte puis retombe. Quel repère simplifie le plus la description ?`,`Origine au point de lancer, Ox horizontal, Oy vertical vers le haut`,[`Origine au sommet de la trajectoire, Ox incliné`,`Origine très loin du lancer, axes inclinés`,`Aucun repère n’est nécessaire`],
  `On place l’origine au point de départ et on choisit des axes horizontal et vertical : les composantes de la vitesse et de la position sont alors faciles à interpréter (v<sub>y</sub> positif quand le ballon monte).`)
];

/* ---------- B2 Vecteur position ---------- */
T.B2=[
()=>{const [A,B]=pick([['O','M'],['O','P'],['O','A']]);
  return MC(`Le <b>vecteur position</b> d’un mobile au point ${B} est le vecteur…`,`d’origine ${A} (origine du repère) et d’extrémité ${B}`,[`d’origine ${B} et d’extrémité ${A}`,`dirigé selon la trajectoire en ${B}`,`d’origine la position précédente du mobile`],
  `Le vecteur position se note ${V('r')} = ${V(A+B)} : il part de l’origine du repère et son extrémité est le mobile.`);},
()=>{const t=Math.random()<.5?pick(SM):[ri(1,6),ri(1,6),0];const x=t[0]*pick([1,-1]),y=t[1]*pick([1,-1]),n=hyp(x,y);
  const p=gridQ(-7,7,-7,7,20);p.arrow(0,0,x,y,'#7A2E3A',2.8).dot(x,y,'#7A2E3A',4).txt(x,y,'M',10,-8);
  return NU(`Un mobile est en <b>M (${fr(x)} ; ${fr(y)})</b> (en m). Calcule la norme de son vecteur position, c’est-à-dire la distance OM (au dixième).`,n,.06,'m',`‖${V('r')}‖ = √(x² + y²) = √(${x*x} + ${y*y}) = √${x*x+y*y} ≈ ${fr(n,1)} m.`,p.svg());},
()=>{const x=-ri(1,7),y=ri(1,7),w=pick(['x','y']);
  return NU(`Un mobile est en <b>M (${fr(x)} ; ${fr(y)})</b> (en m). Quelle est la composante <b>${w}</b> de son vecteur position ${V('r')} ?`,w==='x'?x:y,.01,'m',`Les composantes du vecteur position sont les coordonnées du point : ${V('r')} = (${fr(x)} ; ${fr(y)}) m, donc r<sub>${w}</sub> = ${fr(w==='x'?x:y)} m.`,'',0);},
()=>MC(`On déplace l’origine O du repère, sans bouger le mobile. Que devient le vecteur position du mobile ?`,`Il change (autre origine, autres composantes)`,[`Il reste identique`,`Il devient nul`,`Il garde ses composantes mais change de sens`],
  `Le vecteur position est défini à partir de l’origine du repère : si l’origine change, le vecteur change aussi.`),
()=>TFQ(`Vrai ou faux ?`,[[`Quand le mobile bouge, l’origine de son vecteur position reste en O et l’extrémité suit le mobile.`,`Oui : ${V('r')} = ${V('OM')}. O ne bouge pas, M suit le mobile.`],[`Les composantes du vecteur position sont les coordonnées du mobile.`,`Oui, ${V('r')} = (x ; y).`]],
  [[`Quand le mobile bouge, l’origine du vecteur position se déplace avec lui.`,`Faux : l’origine du vecteur position est toujours O. C’est l’extrémité qui suit le mobile.`],[`La norme du vecteur position est la longueur du trajet parcouru.`,`Faux : c’est la distance entre O et le mobile, en ligne droite.`]]),
()=>{const x=ri(1,8),y=ri(1,8),a=atanD(y/x);
  return NU(`Un mobile est en <b>M (${x} ; ${y})</b>. Quel angle fait son vecteur position avec l’axe Ox ? (en degrés, au dixième)`,a,.6,'°',`tan α = y / x = ${y} / ${x}, donc α = arctan(${fr(y/x,3)}) ≈ ${fr(a,1)}°.`);},
()=>{const s=pick([2,5,10]),t=pick(SM),n=t[2]*s;
  return NU(`Sur un plan, <b>1 carreau représente ${s} m</b>. Un mobile est situé à ${t[0]} carreaux vers la droite et ${t[1]} carreaux vers le haut de l’origine. Quelle est la <b>norme</b> de son vecteur position, en mètres ?`,n,.06,'m',`Distance en carreaux : √(${t[0]}² + ${t[1]}²) = ${t[2]} carreaux. En mètres : ${t[2]} × ${s} = ${n} m.`);},
()=>{const x=ri(-5,6),y=ri(-4,5);return TP(`Le vecteur position d’un mobile est <b>${V('r')} = (${fr(x)} ; ${fr(y)})</b> (en m). Touche l’intersection où se trouve le mobile, puis valide.`,x,y,[-6,7,-5,6],`L’extrémité du vecteur position est le mobile : M (${fr(x)} ; ${fr(y)}).`);}
];

/* ---------- B3 Trajectoire, distance, déplacement ---------- */
T.B3=[
()=>MC(`La <b>trajectoire</b> d’un mobile est…`,`l’ensemble des positions successives occupées par le mobile`,[`la distance totale parcourue`,`le vecteur qui relie la position initiale à la position finale`,`la durée du mouvement`],
  `La trajectoire est une ligne : l’ensemble des positions occupées. La distance parcourue est sa longueur ; le vecteur qui relie départ et arrivée est le déplacement.`),
()=>{const t=pick(TR),e=Math.random()<.5,d1=e?t[0]:t[1],d2=e?t[1]:t[0];
  return NU(`Un mobile va de A à B : il parcourt d’abord <b>${d1} m vers l’est</b>, puis <b>${d2} m vers le nord</b>. Quelle <b>distance</b> a-t-il parcourue ?`,d1+d2,.01,'m',`Distance parcourue = longueur du chemin suivi = ${d1} + ${d2} = ${d1+d2} m.`,'',0);},
()=>{const t=pick(TR),e=Math.random()<.5,d1=e?t[0]:t[1],d2=e?t[1]:t[0];
  return NU(`Un mobile va de A à B : il parcourt d’abord <b>${d1} m vers l’est</b>, puis <b>${d2} m vers le nord</b>. Quelle est la <b>norme du déplacement</b> ‖Δ${V('r')}‖ de A à B ?`,t[2],.06,'m',`Le déplacement est la flèche droite de A vers B : ‖Δ${V('r')}‖ = √(${d1}² + ${d2}²) = ${t[2]} m (plus court que le chemin de ${d1+d2} m).`,'',0);},
()=>MC(`Comment se comparent la <b>distance parcourue</b> d et la <b>norme du déplacement</b> ‖Δ${V('r')}‖ ?`,`d ≥ ‖Δ${V('r')}‖, avec égalité seulement pour un trajet rectiligne sans demi-tour`,[`d = ‖Δ${V('r')}‖ toujours`,`d ≤ ‖Δ${V('r')}‖ toujours`,`Il n’y a aucun lien entre les deux`],
  `Le chemin le plus court entre deux points est la ligne droite : la distance parcourue est donc supérieure ou égale à ‖Δ${V('r')}‖.`),
()=>{const L=pick([200,400,250,300]);
  return MC(`Un coureur fait <b>exactement un tour</b> d’une piste de ${L} m et revient à son point de départ. Que valent la distance parcourue et la norme du déplacement ?`,`d = ${L} m et ‖Δ${V('r')}‖ = 0`,[`d = 0 et ‖Δ${V('r')}‖ = ${L} m`,`d = ${L} m et ‖Δ${V('r')}‖ = ${L} m`,`d = 0 et ‖Δ${V('r')}‖ = 0`],
  `Il a parcouru ${L} m, mais ses positions initiale et finale sont identiques : le déplacement est nul.`);},
()=>TFQ(`Vrai ou faux ?`,[[`Le déplacement peut être nul alors que le mobile a parcouru une grande distance.`,`Oui : par exemple un aller-retour complet.`],[`Le déplacement ne dépend que de la position initiale et de la position finale.`,`Oui : Δ${V('r')} = ${V('r')}<sub>2</sub> − ${V('r')}<sub>1</sub>, le chemin suivi n’intervient pas.`]],
  [[`Le déplacement est toujours égal à la distance parcourue.`,`Faux : il lui est égal seulement en ligne droite sans demi-tour.`],[`Le déplacement dépend de tout le chemin suivi entre les deux positions.`,`Faux : seules les positions initiale et finale comptent.`]]),
()=>{const d1=ri(20,60),d2=ri(5,d1-5);
  return NU(`Un mobile avance de <b>${d1} m</b> en ligne droite, fait demi-tour et revient de <b>${d2} m</b>. À quelle distance est-il de son point de départ ?`,d1-d2,.01,'m',`Les deux trajets sont sur la même droite mais en sens opposés : ${d1} − ${d2} = ${d1-d2} m. La distance parcourue, elle, vaut ${d1+d2} m.`,'',0);}
];

/* ---------- B4 Vecteur déplacement ---------- */
const twoPts=()=>{let x1,y1,x2,y2;do{x1=ri(-4,4);y1=ri(-3,3);x2=ri(-4,4);y2=ri(-3,3);}while(x1===x2&&y1===y2);return [x1,y1,x2,y2];};
const dispFig=(x1,y1,x2,y2)=>{const p=gridQ(-5,5,-4,4,26);p.arrow(x1,y1,x2,y2,'#7A2E3A',2.8).dot(x1,y1,'#1F3A5F',5).dot(x2,y2,'#1F3A5F',5).txt(x1,y1,'P₁',-12,-8).txt(x2,y2,'P₂',12,-8);return p.svg();};
T.B4=[
()=>{const [x1,y1,x2,y2]=twoPts();return NU(`Un mobile passe de <b>P₁ (${fr(x1)} ; ${fr(y1)})</b> à <b>P₂ (${fr(x2)} ; ${fr(y2)})</b> (en m). Calcule la composante <b>Δx</b> du déplacement Δ${V('r')}.`,x2-x1,.01,'m',`Δx = x₂ − x₁ = ${fr(x2)} − ${pa(x1)} = ${fr(x2-x1)} m.`,dispFig(x1,y1,x2,y2),0);},
()=>{const [x1,y1,x2,y2]=twoPts();return NU(`Un mobile passe de <b>P₁ (${fr(x1)} ; ${fr(y1)})</b> à <b>P₂ (${fr(x2)} ; ${fr(y2)})</b> (en m). Calcule la composante <b>Δy</b> du déplacement Δ${V('r')}.`,y2-y1,.01,'m',`Δy = y₂ − y₁ = ${fr(y2)} − ${pa(y1)} = ${fr(y2-y1)} m.`,dispFig(x1,y1,x2,y2),0);},
()=>{const [x1,y1,x2,y2]=twoPts();const dx=x2-x1,dy=y2-y1,n=hyp(dx,dy);return NU(`Un mobile passe de <b>P₁ (${fr(x1)} ; ${fr(y1)})</b> à <b>P₂ (${fr(x2)} ; ${fr(y2)})</b> (en m). Calcule la <b>norme</b> du déplacement ‖Δ${V('r')}‖ (au dixième).`,n,.06,'m',`Δ${V('r')} = (${fr(dx)} ; ${fr(dy)}) puis ‖Δ${V('r')}‖ = √(${dx*dx} + ${dy*dy}) ≈ ${fr(n,1)} m.`,dispFig(x1,y1,x2,y2));},
()=>MC(`Un mobile passe de la position ${V('r')}<sub>1</sub> à la position ${V('r')}<sub>2</sub>. Son vecteur déplacement est…`,`Δ${V('r')} = ${V('r')}<sub>2</sub> − ${V('r')}<sub>1</sub>`,[`Δ${V('r')} = ${V('r')}<sub>1</sub> − ${V('r')}<sub>2</sub>`,`Δ${V('r')} = ${V('r')}<sub>1</sub> + ${V('r')}<sub>2</sub>`,`Δ${V('r')} = ‖${V('r')}<sub>2</sub>‖ − ‖${V('r')}<sub>1</sub>‖`],
  `Δ${V('r')} = ${V('r')}<sub>final</sub> − ${V('r')}<sub>initial</sub> : la flèche part de la position de départ et pointe sur la position d’arrivée.`),
()=>{const x1=ri(-3,3),y1=ri(-2,2),dx=ri(-3,3),dy=ri(-3,3);if(dx===0&&dy===0)return T.B4[4]();
  return TP(`Un mobile est en <b>P₁ (${fr(x1)} ; ${fr(y1)})</b>. Son déplacement est Δ${V('r')} = <b>(${fr(dx)} ; ${fr(dy)})</b>. Touche la position finale P₂, puis valide.`,x1+dx,y1+dy,[-7,7,-6,6],`P₂ = P₁ + Δ${V('r')} = (${fr(x1)} + ${pa(dx)} ; ${fr(y1)} + ${pa(dy)}) = (${fr(x1+dx)} ; ${fr(y1+dy)}).`,p=>p.dot(x1,y1,'#1F3A5F',5).txt(x1,y1,'P₁',-12,-8));},
()=>{const dx=pick([-4,-3,-2,2,3,4]),dy=pick([-3,-2,2,3]);const h=dx>0?'vers la droite':'vers la gauche',v=dy>0?'vers le haut':'vers le bas';
  const good=`${h} et ${v}`;const bads=[];for(const a of ['vers la droite','vers la gauche'])for(const b of ['vers le haut','vers le bas'])if(`${a} et ${b}`!==good)bads.push(`${a} et ${b}`);
  return MC(`Le déplacement d’un mobile est Δ${V('r')} = <b>(${fr(dx)} ; ${fr(dy)})</b> (axe Ox vers la droite, axe Oy vers le haut). Dans quel sens s’est-il déplacé ?`,good,bads,`Δx ${dx>0?'> 0':'< 0'} : ${h}. Δy ${dy>0?'> 0':'< 0'} : ${v}.`);},
()=>MC(`On change l’origine du repère. Que devient le vecteur <b>déplacement</b> Δ${V('r')} entre deux positions ?`,`Il ne change pas`,[`Il change, comme le vecteur position`,`Il devient nul`,`Il change de sens`],
  `Les deux vecteurs position changent de la même quantité, donc leur différence Δ${V('r')} = ${V('r')}<sub>2</sub> − ${V('r')}<sub>1</sub> reste identique : un déplacement ne dépend pas de l’origine choisie.`)
];

/* ---------- B5 Vitesse moyenne ---------- */
T.B5=[
()=>{const t=pick(SM),k=pick([1,2]),dx=t[0]*k*pick([1,-1]),dy=t[1]*k*pick([1,-1]),dt=pick([2,4,5]),n=t[2]*k/dt;
  return NU(`Entre deux instants séparés de <b>Δt = ${dt} s</b>, le déplacement d’un mobile est Δ${V('r')} = <b>(${fr(dx)} ; ${fr(dy)})</b> m. Calcule la <b>norme de la vitesse moyenne</b>.`,n,.06,'m/s',`‖Δ${V('r')}‖ = √(${dx*dx} + ${dy*dy}) = ${t[2]*k} m, donc v<sub>moy</sub> = ${t[2]*k} / ${dt} = ${fr(n,2)} m/s.`);},
()=>{const dt=pick([2,4,5,8]),dx=dt*ri(-4,5)||dt,dy=ri(-6,6),w=pick(['x','y']);const val=w==='x'?dx/dt:dy/dt;
  return NU(`Entre deux instants séparés de <b>Δt = ${dt} s</b>, le déplacement est Δ${V('r')} = <b>(${fr(dx)} ; ${fr(dy)})</b> m. Calcule la composante <b>v<sub>moy,${w}</sub></b> de la vitesse moyenne (au dixième).`,val,.06,'m/s',`${V('v')}<sub>moy</sub> = Δ${V('r')} / Δt, donc v<sub>moy,${w}</sub> = ${fr(w==='x'?dx:dy)} / ${dt} = ${fr(val,2)} m/s.`);},
()=>MC(`Quelle est la direction et le sens du vecteur vitesse moyenne ${V('v')}<sub>moy</sub> = Δ${V('r')} / Δt ?`,`Les mêmes que ceux du déplacement Δ${V('r')}`,[`Ceux du vecteur position final`,`Toujours horizontal vers la droite`,`Opposés à ceux de Δ${V('r')}`],
  `Δt est un nombre positif : diviser un vecteur par un nombre positif ne change ni sa direction ni son sens, seulement sa norme.`),
()=>{const tau=pick([0.05,0.1,0.2,0.5]),n1=ri(2,10),n2=n1+ri(2,8);
  return NU(`Les images d’une chronophotographie sont séparées de <b>τ = ${fr(tau,2)} s</b>. Quelle est la durée Δt entre l’<b>image ${n1}</b> et l’<b>image ${n2}</b> ?`,(n2-n1)*tau,.0011,'s',`Il y a ${n2-n1} intervalles entre ces images : Δt = ${n2-n1} × ${fr(tau,2)} = ${fr((n2-n1)*tau,2)} s.`,'',2);},
()=>{const t=pick(SM),x1=ri(0,3),y1=ri(0,3),e=Math.random()<.5,dx=e?t[0]:t[1],dy=e?t[1]:t[0],tau=pick([0.1,0.2,0.5]),n1=ri(2,6),n2=n1+pick([2,4]),dt=(n2-n1)*tau,n=t[2]/dt;
  return NU(`Sur une chronophotographie (τ = <b>${fr(tau,1)} s</b>), l’<b>image ${n1}</b> est en (${x1} ; ${y1}) et l’<b>image ${n2}</b> en (${x1+dx} ; ${y1+dy}) (en m). Calcule la norme de la vitesse moyenne entre ces deux images.`,n,.06,'m/s',
    `Δ${V('r')} = (${dx} ; ${dy}) donc ‖Δ${V('r')}‖ = ${t[2]} m. Δt = (${n2} − ${n1}) × ${fr(tau,1)} = ${fr(dt,1)} s. v<sub>moy</sub> = ${t[2]} / ${fr(dt,1)} = ${fr(n,2)} m/s.`);},
()=>{const toMs=Math.random()<.5,k=ri(2,30);
  return toMs?NU(`Convertis <b>${fr(k*3.6)} km/h</b> en m/s.`,k,.06,'m/s',`1 km/h = 1000 m / 3600 s = 1/3,6 m/s. On divise par 3,6 : ${fr(k*3.6)} / 3,6 = ${k} m/s.`)
    :NU(`Convertis <b>${k} m/s</b> en km/h.`,k*3.6,.06,'km/h',`On multiplie par 3,6 : ${k} × 3,6 = ${fr(k*3.6)} km/h.`);},
()=>{const m=pick([20,30,45,60]);
  return MC(`Un cycliste part de A, fait un grand tour et revient en A après ${m} minutes. Que vaut son <b>vecteur</b> vitesse moyenne sur ce parcours ?`,`Le vecteur nul`,[`Le même que la vitesse affichée au compteur`,`Un vecteur dirigé vers A`,`Il est impossible de le calculer`],
    `Le déplacement est nul (même position au départ et à l’arrivée) : ${V('v')}<sub>moy</sub> = Δ${V('r')} / Δt = ${V('0')}. (La vitesse moyenne « scalaire » = distance / durée, elle, n’est pas nulle.)`);}
];

/* ---------- B6 Vitesse instantanée ---------- */
T.B6=[
()=>MC(`Sur une chronophotographie, comment estimer le plus correctement la vitesse du mobile à un instant donné ?`,`Par la vitesse moyenne entre deux images voisines (Δt = τ)`,[`Par la vitesse moyenne entre la première et la dernière image`,`En divisant la distance totale par la durée totale`,`En mesurant la taille de l’image du mobile`],
  `Plus l’intervalle de temps Δt est court, plus la vitesse moyenne ressemble à la vitesse à un instant précis. On prend donc deux images voisines.`),
()=>{const t=pick(SM),e=Math.random()<.5,dx=(e?t[0]:t[1])/10,dy=(e?t[1]:t[0])/10,tau=pick([0.1,0.2,0.5]),k=ri(3,12);
  return NU(`Entre les <b>images ${k} et ${k+1}</b> (τ = ${fr(tau,1)} s), le mobile se déplace de Δ${V('r')} = (${fr(dx)} ; ${fr(dy)}) m. Estime la <b>norme de sa vitesse</b> à cet instant.`,t[2]/10/tau,.06,'m/s',`‖Δ${V('r')}‖ = ${fr(t[2]/10,2)} m en Δt = ${fr(tau,1)} s : v ≈ ${fr(t[2]/10,2)} / ${fr(tau,1)} = ${fr(t[2]/10/tau,2)} m/s.`);},
()=>{const tau=pick([0.1,0.2,0.5]),k=ri(3,12),dx=ri(1,5)/10,dy=ri(-4,4)/10,w=pick(['x','y']);const val=(w==='x'?dx:dy)/tau;
  return NU(`Entre les <b>images ${k} et ${k+1}</b> (τ = ${fr(tau,1)} s), le déplacement est Δ${V('r')} = (${fr(dx)} ; ${fr(dy)}) m. Estime la composante <b>v<sub>${w}</sub></b> de la vitesse à cet instant.`,val,.06,'m/s',`v<sub>${w}</sub> ≈ Δ${w} / τ = ${fr(w==='x'?dx:dy)} / ${fr(tau,1)} = ${fr(val,2)} m/s.`);},
()=>{const k=ri(5,12),far=ri(4,7);
  return MC(`Pour estimer la vitesse du mobile à peu près à l’image ${k}, quel intervalle est le <b>meilleur</b> choix ?`,`Entre les images ${k} et ${k+1}`,[`Entre les images ${k} et ${k+far}`,`Entre les images ${k-far>0?k-far:1} et ${k+far}`,`Entre l’image 1 et la dernière image`],
    `Plus l’intervalle est court, mieux la vitesse moyenne représente la vitesse instantanée : on prend deux images voisines.`);},
()=>TFQ(`Vrai ou faux ?`,[[`Plus l’intervalle Δt est petit, plus la vitesse moyenne est proche de la vitesse instantanée.`,`Oui : c’est l’idée de base pour passer de la vitesse moyenne à la vitesse instantanée.`],[`Sur une chronophotographie, on estime la vitesse à un instant avec deux images voisines.`,`Oui : Δt = τ est le plus petit intervalle accessible.`]],
  [[`Pour estimer la vitesse instantanée, il vaut mieux prendre le plus grand intervalle de temps possible.`,`Faux : un grand intervalle ne donne qu’une moyenne.`],[`La vitesse moyenne entre deux images éloignées est toujours égale à la vitesse instantanée.`,`Faux : le mouvement peut changer entre-temps.`]]),
()=>MC(`Le <b>vecteur vitesse instantanée</b> d’un mobile sur une trajectoire courbe est…`,`tangent à la trajectoire et orienté dans le sens du mouvement`,[`perpendiculaire à la trajectoire`,`dirigé vers l’origine du repère`,`toujours horizontal`],
  `En un point de la trajectoire, la direction de la vitesse est celle de la tangente : le mobile « part » dans cette direction. Le sens est celui du mouvement.`),
()=>{const f=pick([10,20,25,50,100]);
  return NU(`Une vidéo est tournée à <b>${f} images par seconde</b>. Quelle est la durée entre deux images voisines ? (en millisecondes)`,1000/f,.6,'ms',`τ = 1 / ${f} s = ${fr(1000/f,1)} ms.`);}
];

/* ---------- B7 Le vecteur vitesse ---------- */
T.B7=[
()=>{const e=pick([1,2,5,10]),L=pick([1.5,2,2.5,3,3.5,4,5]);
  return NU(`On représente les vitesses avec l’échelle <b>1 cm ↔ ${e} m/s</b>. Un vecteur vitesse mesure <b>${fr(L)} cm</b>. Quelle est sa norme ?`,L*e,.06,'m/s',`${fr(L)} cm × ${e} m/s par cm = ${fr(L*e)} m/s.`);},
()=>{const e=pick([2,4,5,10]),L=pick([1,2,3,4,5]),v=L*e;
  return NU(`Avec l’échelle <b>1 cm ↔ ${e} m/s</b>, quelle longueur (en cm) doit avoir la flèche d’un vecteur vitesse de <b>${v} m/s</b> ?`,L,.06,'cm',`${v} m/s ÷ ${e} m/s par cm = ${L} cm.`,'',1);},
()=>MC(`Quelles sont les caractéristiques complètes d’un vecteur vitesse ?`,`Le point d’application (le mobile), la direction, le sens et la norme`,[`Seulement la norme et l’unité`,`La direction et la durée`,`Le point d’arrivée et la distance parcourue`],
  `Un vecteur est défini par quatre éléments : son point d’application (ici le mobile), sa direction, son sens et sa norme (en m/s).`),

/* ---------- B10 Bilan chronophotographie ---------- */
function mkChrono(){
  const vx=pick([1,2]),b=pick([4,5,6]),tau=pick([0.5,1]),N=7;
  const xs=[],ys=[];for(let n=0;n<N;n++){xs.push(1+vx*n);ys.push(b*n-n*n);}
  return {vx,b,tau,N,xs,ys,svg:chronoSvg(xs,ys,1+vx*(N-1)+1,Math.max(...ys)+1,{c:vx===1?32:22})};
}
const pairV=(c,k)=>({x:(c.xs[k-1]-c.xs[k-2])/c.tau,y:(c.ys[k-1]-c.ys[k-2])/c.tau});
T.B10=[
()=>{const c=mkChrono(),k=ri(1,c.N),w=pick(['x','y']);const val=w==='x'?c.xs[k-1]:c.ys[k-1];
  return NU(`Chronophotographie d’un ballon (1 carreau = 1 m). Lis la coordonnée <b>${w}</b> de l’<b>image ${k}</b> (en m).`,val,.01,'m',`On lit la position de l’image ${k} sur le quadrillage : (${fr(c.xs[k-1])} ; ${fr(c.ys[k-1])}), donc ${w} = ${fr(val)} m.`,c.svg,0);},
()=>{const c=mkChrono(),k=ri(1,c.N-3),k2=k+pick([2,3]);const dx=c.xs[k2-1]-c.xs[k-1],dy=c.ys[k2-1]-c.ys[k-1],n=hyp(dx,dy);
  return NU(`Chronophotographie d’un ballon (1 carreau = 1 m). Calcule la <b>norme du déplacement</b> ‖Δ${V('r')}‖ entre l’<b>image ${k}</b> et l’<b>image ${k2}</b> (au dixième).`,n,.06,'m',`Positions : (${c.xs[k-1]} ; ${c.ys[k-1]}) et (${c.xs[k2-1]} ; ${c.ys[k2-1]}). Δ${V('r')} = (${fr(dx)} ; ${fr(dy)}) donc ‖Δ${V('r')}‖ = √(${dx*dx} + ${dy*dy}) ≈ ${fr(n,1)} m.`,c.svg);},
()=>{const c=mkChrono(),k=ri(1,c.N-3),k2=k+pick([2,3]);const dx=c.xs[k2-1]-c.xs[k-1],dy=c.ys[k2-1]-c.ys[k-1],dt=(k2-k)*c.tau,n=hyp(dx,dy)/dt;
  return NU(`Chronophotographie d’un ballon (1 carreau = 1 m, <b>τ = ${fr(c.tau,1)} s</b> entre deux images). Calcule la <b>norme de la vitesse moyenne</b> entre l’<b>image ${k}</b> et l’<b>image ${k2}</b> (au dixième).`,n,.06,'m/s',`Δ${V('r')} = (${fr(dx)} ; ${fr(dy)}) donc ‖Δ${V('r')}‖ = ${fr(hyp(dx,dy),2)} m. Δt = ${k2-k} × ${fr(c.tau,1)} = ${fr(dt,1)} s. v<sub>moy</sub> = ${fr(hyp(dx,dy),2)} / ${fr(dt,1)} ≈ ${fr(n,1)} m/s.`,c.svg);},
()=>{const c=mkChrono(),k=ri(2,c.N-1),w=pick(['x','y']);const v=pairV(c,k);const val=w==='x'?v.x:v.y;
  return NU(`Chronophotographie d’un ballon (1 carreau = 1 m, <b>τ = ${fr(c.tau,1)} s</b>). Estime la composante <b>v<sub>${w}</sub></b> de la vitesse entre l’<b>image ${k-1}</b> et l’<b>image ${k}</b>, par la vitesse moyenne entre ces deux images voisines (en m/s).`,val,.06,'m/s',`Entre les images ${k-1} et ${k} : Δ${w} = ${fr(w==='x'?c.xs[k-1]-c.xs[k-2]:c.ys[k-1]-c.ys[k-2])} m en Δt = ${fr(c.tau,1)} s, donc v<sub>${w}</sub> ≈ ${fr(val,2)} m/s.`,c.svg,1);},

/* ================= Sauvegarde locale ================= */
const KEY='parcours-description-mouvement-v2',KEY1='parcours-description-mouvement-v1';
let S={};
function load(){try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r)||{};}else{const o=JSON.parse(localStorage.getItem(KEY1)||'{}')||{};S={};['B5','B6','B7','B8','B9','B10'].forEach(k=>{if(o[k])S[k]=o[k];});}}catch(e){S={};}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function st(id){if(!S[id]){S[id]={ok:T[id].map(()=>0),seen:T[id].map(()=>0),due:T[id].map(()=>0)};}return S[id];}
const NEED=id=>((STEPS.find(x=>x.id===id)||{}).need||2);
function retired(id){const s=st(id),m=NEED(id);return s.ok.filter(k=>k>=m).length;}
function pct(id){return Math.round(100*retired(id)/T[id].length);}
function isDone(id){return retired(id)===T[id].length;}

/* ================= Composition d'une séance ================= */
const SESSION=4;
function compose(id){
  const s=st(id),n=T[id].length;
  const m=NEED(id),act=[...Array(n).keys()].filter(i=>s.ok[i]<m);
  const due=shuffle(act.filter(i=>s.due[i])),uns=shuffle(act.filter(i=>!s.seen[i])),oth=shuffle(act.filter(i=>s.seen[i]&&!s.due[i]));
  const size=Math.min(SESSION,act.length);const minNew=Math.floor(size/2)+1;
  let list=[];
  if(due.length===0&&oth.length===0||uns.length>=size&&due.length===0){list=uns.slice(0,size);}
  else{
    const rev=Math.min(due.length,size-Math.min(uns.length,minNew));
    list=due.slice(0,Math.max(0,rev)).concat(uns.slice(0,size-Math.max(0,rev)));
  }
  const pool=due.concat(oth).filter(i=>!list.includes(i));
  while(list.length<size&&pool.length)list.push(pool.shift());
  const rest=uns.filter(i=>!list.includes(i));
  while(list.length<size&&rest.length)list.push(rest.shift());
  const nNew=list.filter(i=>!s.seen[i]).length;
  return {list:shuffle(list),nNew,size:list.length};
}

function show(html){$('app').innerHTML=html;window.scrollTo(0,0);}

    html+=`</div>`;
  });
  html+=`<p class="sm" style="text-align:center;margin-top:24px">Tu peux commencer où tu veux, mais la zone A aide beaucoup pour la zone B. Ta progression est enregistrée sur cet appareil.</p><button class="reset" id="rst">Effacer ma progression</button>`;
  show(html);
  $('rst').onclick=function(){if(this.dataset.c){S={};save();home();}else{this.dataset.c=1;this.textContent='Appuie encore pour confirmer';}};
}

function openStep(id){
  cur=STEPS.find(s=>s.id===id);const w=cur.wid?cur.wid():null;
  const p=pct(id);
  show(`<button class="back" onclick="home()">‹ Retour au parcours</button><div class="card"><div class="kk">${cur.kick}</div><h2>${cur.title}</h2>${cur.cap()}${w?w.html:''}</div>
  <button class="cta" style="background:${ZONES[cur.z].col}" onclick="startSession('${id}')">${isDone(id)?'Refaire des questions':p>0?'Continuer les questions':'Je teste ce que j’ai compris'} →</button>`);
  if(w)w.init();
}

function startSession(id){
  cur=STEPS.find(s=>s.id===id);
  const c=compose(id);
  sess={id,queue:c.list.map(i=>({ti:i,retry:false})),idx:0,good:0,total:0,seenRetry:{},len:c.list.length};
  nextQ();
}
function nextQ(){
  if(sess.idx>=sess.queue.length)return endSession();
  const it=sess.queue[sess.idx];const q=T[sess.id][it.ti]();sess.q=q;sess.it=it;answered=false;pick1=null;
  const pc=Math.round(100*sess.idx/sess.queue.length);
  let body=`<div class="sess-top"><button class="x" onclick="openStep('${sess.id}')" aria-label="Quitter">✕</button><div class="tr"><i style="width:${pc}%"></i></div><span class="sm">${sess.idx+1}/${sess.queue.length}</span></div><div class="card q"><div class="kk">${cur.title}${it.retry?' · on y revient':''}</div><p class="qq">${q.q}</p>${q.svg?`<div class="fig" id="qfig">${q.svg}</div>`:''}`;
  if(q.t==='mcq')body+=q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.x}</button>`).join('');
  else if(q.t==='num')body+=`<div class="numrow"><input id="ans" type="text" inputmode="decimal" autocomplete="off" autocapitalize="off" placeholder="ta réponse"><span class="u">${q.unit}</span></div>`;
  else body+=`<p class="sm" id="tapmsg">Touche une intersection du quadrillage.</p>`;
  body+=`<div id="fb"></div><button class="cta" id="go" style="background:${ZONES[cur.z].col}" disabled>Valider</button></div>`;
  show(body);
  const go=$('go');
  if(q.t==='mcq'){document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');pick1=+b.dataset.i;go.disabled=false;});}
  else if(q.t==='num'){const inp=$('ans');inp.oninput=()=>{go.disabled=!inp.value.trim();};inp.onkeydown=e=>{if(e.key==='Enter'&&!go.disabled&&!answered)check();};}
  else{const svg=$('qfig').querySelector('svg');svg.addEventListener('click',e=>{if(answered)return;const t=e.target.closest('.nd');if(!t)return;
      let m=svg.querySelector('#mk');if(!m){m=document.createElementNS('http://www.w3.org/2000/svg','circle');m.setAttribute('id','mk');m.setAttribute('r','7');m.setAttribute('fill','#B8932F');m.setAttribute('stroke','#fff');m.setAttribute('stroke-width','2');svg.appendChild(m);}
      m.setAttribute('cx',t.getAttribute('cx'));m.setAttribute('cy',t.getAttribute('cy'));pick1={x:+t.dataset.x,y:+t.dataset.y};$('tapmsg').innerHTML=`Point choisi : <b>(${fr(pick1.x)} ; ${fr(pick1.y)})</b>`;go.disabled=false;});}
  go.onclick=()=>{if(!answered)check();else{sess.idx++;nextQ();}};
}
function parseNum(v){v=String(v).replace(/\s/g,'').replace(',','.').replace(/[−–]/g,'-');return /^-?\d+(\.\d+)?$/.test(v)?parseFloat(v):NaN;}
function check(){
  const q=sess.q,it=sess.it,s=st(sess.id);let ok=false,shown='';
  if(q.t==='mcq'){ok=!!q.opts[pick1].ok;document.querySelectorAll('.opt').forEach((b,i)=>{b.classList.remove('sel');if(q.opts[i].ok)b.classList.add('good');else if(i===pick1)b.classList.add('bad');});}
  else if(q.t==='num'){const v=parseNum($('ans').value);if(isNaN(v)){$('fb').innerHTML=`<div class="fb ko"><b class="h">Je n’ai pas compris ta réponse.</b>Écris un nombre, par exemple 12,5.</div>`;return;}
    ok=Math.abs(v-q.ans)<=q.tol+1e-9;shown=`<br>Réponse attendue : <b>${fr(q.ans,q.dec)}${q.unit?' '+q.unit:''}</b>`;$('ans').disabled=true;}
  else{ok=pick1.x===q.tx&&pick1.y===q.ty;shown=`<br>Bonne position : <b>(${fr(q.tx)} ; ${fr(q.ty)})</b>`;
    const svg=$('qfig').querySelector('svg');const t=svg.querySelector(`.nd[data-x="${q.tx}"][data-y="${q.ty}"]`);
    const g=document.createElementNS('http://www.w3.org/2000/svg','circle');g.setAttribute('cx',t.getAttribute('cx'));g.setAttribute('cy',t.getAttribute('cy'));g.setAttribute('r','8');g.setAttribute('fill','none');g.setAttribute('stroke',ok?'#2E7D4F':'#A63A3A');g.setAttribute('stroke-width','3');svg.appendChild(g);}
  answered=true;sess.total++;
  const ti=it.ti;s.seen[ti]=1;
  if(ok){sess.good++;s.ok[ti]++;s.due[ti]=0;}
  else{s.due[ti]=1;if(!sess.seenRetry[ti]&&sess.queue.length<sess.len+4){sess.seenRetry[ti]=1;sess.queue.push({ti,retry:true});}}
  save();
  $('fb').innerHTML=`<div class="fb ${ok?'ok':'ko'}"><b class="h">${ok?pick(['Bravo !','Exact !','C’est ça !','Bien joué !']):'Pas tout à fait.'}</b>${ok?'':shown.replace(/^<br>/,'')+'<br>'}${q.expl}${ok&&q.t==='num'?'':''}</div>`;
  const go=$('go');go.disabled=false;go.textContent=(sess.idx+1>=sess.queue.length)?'Terminer la série':'Continuer';
}

function endSession(){
  const id=sess.id,s=cur,done=isDone(id),p=pct(id);
  const zoneDone=STEPS.filter(x=>x.z===s.z).every(x=>isDone(x.id)),allDone=STEPS.every(x=>isDone(x.id));
  const left=T[id].length-retired(id);
  let msg=done?`<p><b>Étape validée !</b> Toutes les questions de cette étape ont été réussies deux fois.</p>`:`<p>Il reste <b>${left}</b> question${left>1?'s':''} à valider (deux réussites chacune). Les questions ratées reviennent avec de nouvelles valeurs.</p>`;
  show(`<div class="card res" style="text-align:center"><div class="kk">${s.title}</div><div class="big">${sess.good} / ${sess.total}</div><h2>${done?'Étape terminée':'Série terminée'}</h2>${msg}<div class="bar" style="justify-content:center"><div class="tr" style="max-width:240px"><i style="width:${p}%"></i></div><span>${p} %</span></div>
  ${done?'':`<button class="cta" style="background:${ZONES[s.z].col}" onclick="startSession('${id}')">Série suivante →</button>`}
  <button class="cta sec" onclick="openStep('${id}')">Revoir la capsule</button><button class="cta sec" onclick="home()">Retour au parcours</button></div>`);
  if(allDone){celebrate('Parcours terminé !','Tu maîtrises les prérequis et le chapitre. Bravo.');}
  else if(done&&zoneDone){celebrate(s.z==='A'?'Zone A terminée !':'Zone B terminée !',s.z==='A'?'Les prérequis sont solides : place au chapitre.':'Tout le chapitre est validé.');}
}

/* ================= Gong + feu d'artifice ================= */
let audio=null;
function unlock(){try{if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC();}if(audio&&audio.state==='suspended')audio.resume();}catch(e){}}
function gong(){
  try{unlock();if(!audio)return;
    const ctx=audio,t0=ctx.currentTime+0.02,master=ctx.createGain();master.gain.value=0.55;master.connect(ctx.destination);const f0=96;
    [[1,1,7],[1.004,.8,7],[1.5,.5,5.5],[2.0,.55,5],[2.76,.35,4],[3.39,.25,3],[4.15,.18,2.4],[5.4,.12,1.8]].forEach(([r,g,d])=>{
      const o=ctx.createOscillator(),gn=ctx.createGain();o.type='sine';o.frequency.value=f0*r;gn.gain.setValueAtTime(0.0001,t0);
      gn.gain.exponentialRampToValueAtTime(g*0.5,t0+0.015);gn.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(gn);gn.connect(master);o.start(t0);o.stop(t0+d+0.1);});
    const len=ctx.sampleRate*0.25,buf=ctx.createBuffer(1,len,ctx.sampleRate),dd=buf.getChannelData(0);for(let k=0;k<len;k++)dd[k]=(Math.random()*2-1)*Math.pow(1-k/len,3);
    const ns=ctx.createBufferSource(),bp=ctx.createBiquadFilter(),ng=ctx.createGain();ns.buffer=buf;bp.type='bandpass';bp.frequency.value=700;ng.gain.value=0.4;ns.connect(bp);bp.connect(ng);ng.connect(master);ns.start(t0);
  }catch(e){}
}
let fwOn=false;
function fireworks(){
  const c=$('fw'),ctx=c.getContext('2d');fwOn=true;const dpr=Math.min(window.devicePixelRatio||1,2);
  const rs=()=>{c.width=innerWidth*dpr;c.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);};rs();window.onresize=rs;
  let parts=[],last=0;const burst=(x,y)=>{const h=Math.random()*360;for(let k=0;k<80;k++){const a=Math.random()*6.283,s=Math.random()*4.2+1;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h:h+Math.random()*50});}};
  const frame=t=>{if(!fwOn){ctx.clearRect(0,0,innerWidth,innerHeight);return;}
    if(t-last>380+Math.random()*350){burst(innerWidth*(.12+Math.random()*.76),innerHeight*(.1+Math.random()*.45));last=t;}
    ctx.globalCompositeOperation='destination-out';ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.globalCompositeOperation='lighter';
    parts=parts.filter(p=>p.l>0);for(const p of parts){p.vy+=.045;p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.vy*=.985;p.l-=.011;ctx.fillStyle=`hsla(${p.h},100%,60%,${Math.max(p.l,0)})`;ctx.beginPath();ctx.arc(p.x,p.y,2.2,0,6.283);ctx.fill();}
    requestAnimationFrame(frame);};
  requestAnimationFrame(frame);
}
function stopFw(){fwOn=false;$('sky').style.display='none';}
function celebrate(t,p){$('bravo').textContent=t;$('bravop').textContent=p;$('sky').style.display='block';gong();fireworks();}
$('skyok').onclick=stopFw;
document.addEventListener('pointerdown',unlock,{passive:true});

home();
</script>
